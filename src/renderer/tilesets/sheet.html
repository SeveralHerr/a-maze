<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A-MAZE — tileset sheet</title>
    <link rel="icon" href="data:," />
    <!--
      Art-review harness, not shipped: every surface of one tileset, tiled so seams show.
        ?tileset=<id>   which tileset (default keep)
        ?scale=3        texel size in CSS pixels
      Row 1: the 4 wall variants, each tiled 2× across. Row 2: the 3 floors, then the 2 ceilings,
      each tiled 2×2. Row 3 mixes variants the way the raycaster does, so a seam BETWEEN variants
      shows: a wall strip, a 4×4 floor patch and a ceiling column. Colours are the raw palette.
    -->
    <style>
      body { margin: 0; background: #07090f; color: #c9cfd8; font: 12px monospace; }
      .row { display: flex; gap: 12px; padding: 8px 12px; flex-wrap: wrap; align-items: flex-start; }
      figure { margin: 0; }
      figcaption { padding: 2px 0; }
      canvas { image-rendering: pixelated; display: block; }
      h1 { font-size: 14px; margin: 8px 12px 0; }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <div class="row" id="walls"></div>
    <div class="row" id="flats"></div>
    <div class="row" id="mixes"></div>
    <script type="module">
      import { createTilesetTextures, tilesetIndexById, TILESETS } from './index.js';
      import { PALETTE } from '../palette.js';
      const q = new URLSearchParams(location.search);
      const idx = Math.max(0, tilesetIndexById(q.get('tileset') || 'keep'));
      const scale = Number(q.get('scale')) || 3;
      const set = createTilesetTextures(idx);
      document.getElementById('title').textContent = `${TILESETS[idx].name} (${TILESETS[idx].id})`;
      /** Draw a grid of textures: `pick(i, j)` returns the texture for tile column i, row j. */
      function grid(pick, nx, ny, label, parent) {
        const c = document.createElement('canvas');
        c.width = 64 * nx; c.height = 64 * ny;
        c.style.width = `${64 * nx * scale}px`; c.style.height = `${64 * ny * scale}px`;
        const ctx = c.getContext('2d');
        const img = ctx.createImageData(c.width, c.height);
        const out = new Uint32Array(img.data.buffer);
        for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
          out[y * c.width + x] = PALETTE[pick(x >> 6, y >> 6).indices[((y & 63) << 6) | (x & 63)]] | 0xff000000;
        }
        ctx.putImageData(img, 0, 0);
        const f = document.createElement('figure');
        const cap = document.createElement('figcaption');
        cap.textContent = label;
        f.append(cap, c);
        parent.append(f);
      }
      const tile = (tex, nx, ny, label, parent) => grid(() => tex, nx, ny, label, parent);
      set.wall.forEach((t, i) => tile(t, 2, 1, `wall[${i}]`, document.getElementById('walls')));
      set.floor.forEach((t, i) => tile(t, 2, 2, `floor[${i}]`, document.getElementById('flats')));
      set.ceiling.forEach((t, i) => tile(t, 2, 2, `ceiling[${i}]`, document.getElementById('flats')));
      // Every ordered pair of wall variants appears side by side in this strip.
      const WALLS = [0, 1, 2, 3, 0, 2, 1, 3, 1, 0, 3, 2, 0];
      const mixes = document.getElementById('mixes');
      grid((i) => set.wall[WALLS[i] % set.wall.length], WALLS.length, 1, 'walls mixed 0 1 2 3 0 2 1 3 1 0 3 2 0', mixes);
      const FLOORS = [0, 1, 0, 2, 1, 2, 0, 1, 2, 0, 1, 1, 0, 0, 2, 1];
      grid((i, j) => set.floor[FLOORS[j * 4 + i] % set.floor.length], 4, 4, 'floors mixed', mixes);
      const CEILS = [0, 1, 0, 0, 1];
      grid((i, j) => set.ceiling[CEILS[j] % set.ceiling.length], 1, CEILS.length, 'ceilings mixed', mixes);
      window.__sheetReady = true;
    </script>
  </body>
</html>
